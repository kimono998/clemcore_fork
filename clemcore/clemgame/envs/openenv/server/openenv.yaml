spec_version: 1
name: clem_env
version: 0.1.0
type: space
runtime: fastapi
app: server.app:app
port: 8000
validation:
  reward:
    range: [-1.0, 1.0]   # ABORTED = -1, FAILURE = 0, SUCCESS = 1
    oracle_tolerance: 0.0
    floor_margin: 0.1
  resources:
    cpu: 2.0
    memory_mb: 4096
    disk_mb: 2048
    episode_timeout_s: 300.0
  capabilities:
    verifier:
      kind: reward_channel
    task_api: true
  types:
    tags: [game, language, multi-turn]
